<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organization Admin - Feature Flag System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 800px;
      margin: 0 auto;
    }

    h1, h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
    }

    .tab {
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 16px;
      color: #666;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      color: #f5576c;
      border-bottom-color: #f5576c;
      font-weight: bold;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #f5576c;
    }

    button {
      padding: 12px 24px;
      background: #f5576c;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #e04658;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .message {
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
    }

    .error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }

    .success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }

    .hidden {
      display: none;
    }

    .logout-btn {
      background: #e74c3c;
      margin-bottom: 20px;
    }

    .logout-btn:hover {
      background: #c0392b;
    }

    .flag-list {
      margin-top: 30px;
    }

    .flag-item {
      padding: 20px;
      background: #f8f9fa;
      margin-bottom: 15px;
      border-radius: 5px;
      border-left: 4px solid #f5576c;
    }

    .flag-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .flag-key {
      font-size: 18px;
      font-weight: bold;
      color: #f5576c;
      font-family: monospace;
    }

    .flag-status {
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .flag-status.enabled {
      background: #d4edda;
      color: #155724;
    }

    .flag-status.disabled {
      background: #f8d7da;
      color: #721c24;
    }

    .flag-description {
      color: #666;
      margin-bottom: 15px;
    }

    .flag-actions {
      display: flex;
      gap: 10px;
    }

    .flag-actions button {
      padding: 8px 16px;
      font-size: 14px;
    }

    .toggle-btn {
      background: #28a745;
    }

    .toggle-btn:hover {
      background: #218838;
    }

    .toggle-btn.disable {
      background: #ffc107;
    }

    .toggle-btn.disable:hover {
      background: #e0a800;
    }

    .delete-btn {
      background: #dc3545;
    }

    .delete-btn:hover {
      background: #c82333;
    }

    .link {
      color: #f5576c;
      cursor: pointer;
      text-decoration: underline;
    }

    .welcome {
      background: #e7f3ff;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      border-left: 4px solid #2196f3;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Section -->
    <div id="loginSection">
      <h1>Organization Admin</h1>
      <div class="tabs">
        <button class="tab active" onclick="switchAuthTab('login')">Login</button>
        <button class="tab" onclick="switchAuthTab('signup')">Sign Up</button>
      </div>

      <!-- Login Tab -->
      <div id="loginTab" class="tab-content active">
        <div id="loginMessage" class="message hidden"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required>
          </div>
          <button type="submit">Login</button>
        </form>
      </div>

      <!-- Signup Tab -->
      <div id="signupTab" class="tab-content">
        <div id="signupMessage" class="message hidden"></div>
        <form id="signupForm">
          <div class="form-group">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" required>
          </div>
          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" required>
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" required minlength="6">
          </div>
          <div class="form-group">
            <label for="organizationId">Organization ID</label>
            <input type="text" id="organizationId" required placeholder="Get this from Super Admin">
          </div>
          <button type="submit">Sign Up</button>
        </form>
      </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="hidden">
      <button class="logout-btn" onclick="logout()">Logout</button>
      
      <div class="welcome">
        <h2 id="welcomeMessage">Welcome!</h2>
        <p id="orgInfo"></p>
      </div>

      <h1>Feature Flag Management</h1>
      <div id="dashboardMessage" class="message hidden"></div>
      
      <h2>Create New Feature Flag</h2>
      <form id="createFlagForm">
        <div class="form-group">
          <label for="flagKey">Feature Key</label>
          <input type="text" id="flagKey" required placeholder="e.g., dark_mode, new_dashboard">
        </div>
        <div class="form-group">
          <label for="flagDescription">Description</label>
          <textarea id="flagDescription" placeholder="What does this feature do?"></textarea>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="flagEnabled"> Enable immediately
          </label>
        </div>
        <button type="submit">Create Feature Flag</button>
      </form>

      <div class="flag-list">
        <h2>Your Feature Flags</h2>
        <div id="flagsContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';
    let token = localStorage.getItem('adminToken');
    let currentUser = JSON.parse(localStorage.getItem('adminUser') || 'null');

    // Initialize
    if (token && currentUser) {
      showDashboard();
    }

    // Auth tab switching
    function switchAuthTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      
      if (tab === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('loginTab').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('signupTab').classList.add('active');
      }
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch(`${API_URL}/auth/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          token = data.token;
          currentUser = data.user;
          localStorage.setItem('adminToken', token);
          localStorage.setItem('adminUser', JSON.stringify(currentUser));
          showDashboard();
        } else {
          showMessage('loginMessage', data.error || 'Login failed', 'error');
        }
      } catch (error) {
        showMessage('loginMessage', 'Failed to connect to server', 'error');
      }
    });

    // Signup
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const organizationId = document.getElementById('organizationId').value;

      try {
        const response = await fetch(`${API_URL}/auth/admin/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, organizationId })
        });

        const data = await response.json();

        if (response.ok) {
          token = data.token;
          currentUser = data.user;
          localStorage.setItem('adminToken', token);
          localStorage.setItem('adminUser', JSON.stringify(currentUser));
          showDashboard();
        } else {
          showMessage('signupMessage', data.error || 'Signup failed', 'error');
        }
      } catch (error) {
        showMessage('signupMessage', 'Failed to connect to server', 'error');
      }
    });

    // Create Feature Flag
    document.getElementById('createFlagForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const key = document.getElementById('flagKey').value;
      const description = document.getElementById('flagDescription').value;
      const enabled = document.getElementById('flagEnabled').checked;

      try {
        const response = await fetch(`${API_URL}/feature-flags`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ key, description, enabled })
        });

        const data = await response.json();

        if (response.ok) {
          showMessage('dashboardMessage', 'Feature flag created successfully!', 'success');
          document.getElementById('createFlagForm').reset();
          loadFeatureFlags();
        } else {
          showMessage('dashboardMessage', data.error || 'Failed to create feature flag', 'error');
        }
      } catch (error) {
        showMessage('dashboardMessage', 'Failed to connect to server', 'error');
      }
    });

    // Load Feature Flags
    async function loadFeatureFlags() {
      try {
        const response = await fetch(`${API_URL}/feature-flags`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const flags = await response.json();

        if (response.ok) {
          const container = document.getElementById('flagsContainer');
          
          if (flags.length === 0) {
            container.innerHTML = '<p style="color: #666;">No feature flags yet. Create one above!</p>';
          } else {
            container.innerHTML = flags.map(flag => `
              <div class="flag-item">
                <div class="flag-header">
                  <div class="flag-key">${flag.key}</div>
                  <div class="flag-status ${flag.enabled ? 'enabled' : 'disabled'}">
                    ${flag.enabled ? 'ENABLED' : 'DISABLED'}
                  </div>
                </div>
                <div class="flag-description">${flag.description || 'No description'}</div>
                <div class="flag-actions">
                  <button class="toggle-btn ${flag.enabled ? 'disable' : ''}" onclick="toggleFlag('${flag.id}', ${!flag.enabled})">
                    ${flag.enabled ? 'Disable' : 'Enable'}
                  </button>
                  <button class="delete-btn" onclick="deleteFlag('${flag.id}')">Delete</button>
                </div>
              </div>
            `).join('');
          }
        }
      } catch (error) {
        console.error('Failed to load feature flags', error);
      }
    }

    // Toggle Feature Flag
    async function toggleFlag(id, enabled) {
      try {
        const response = await fetch(`${API_URL}/feature-flags/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ enabled })
        });

        if (response.ok) {
          showMessage('dashboardMessage', `Feature flag ${enabled ? 'enabled' : 'disabled'}!`, 'success');
          loadFeatureFlags();
        } else {
          const data = await response.json();
          showMessage('dashboardMessage', data.error || 'Failed to update feature flag', 'error');
        }
      } catch (error) {
        showMessage('dashboardMessage', 'Failed to connect to server', 'error');
      }
    }

    // Delete Feature Flag
    async function deleteFlag(id) {
      if (!confirm('Are you sure you want to delete this feature flag?')) return;

      try {
        const response = await fetch(`${API_URL}/feature-flags/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          showMessage('dashboardMessage', 'Feature flag deleted!', 'success');
          loadFeatureFlags();
        } else {
          const data = await response.json();
          showMessage('dashboardMessage', data.error || 'Failed to delete feature flag', 'error');
        }
      } catch (error) {
        showMessage('dashboardMessage', 'Failed to connect to server', 'error');
      }
    }

    function showDashboard() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('welcomeMessage').textContent = `Welcome, ${currentUser.name}!`;
      document.getElementById('orgInfo').textContent = `Organization ID: ${currentUser.organizationId}`;
      loadFeatureFlags();
    }

    function logout() {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminUser');
      token = null;
      currentUser = null;
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('loginForm').reset();
      switchAuthTab('login');
    }

    function showMessage(elementId, message, type) {
      const element = document.getElementById(elementId);
      element.textContent = message;
      element.className = `message ${type}`;
      element.classList.remove('hidden');
      
      setTimeout(() => {
        element.classList.add('hidden');
      }, 5000);
    }
  </script>
</body>
</html>
