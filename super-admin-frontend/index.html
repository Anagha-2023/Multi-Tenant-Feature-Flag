<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin - Feature Flag System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 600px;
    }

    h1, h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #5568d3;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .message {
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
    }

    .error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }

    .success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }

    .hidden {
      display: none;
    }

    .logout-btn {
      background: #e74c3c;
      margin-bottom: 20px;
    }

    .logout-btn:hover {
      background: #c0392b;
    }

    .org-list {
      list-style: none;
      margin-top: 20px;
    }

    .org-item {
      padding: 15px;
      background: #f8f9fa;
      margin-bottom: 10px;
      border-radius: 5px;
      border-left: 4px solid #667eea;
    }

    .org-item h3 {
      color: #667eea;
      margin-bottom: 5px;
    }

    .org-item p {
      color: #666;
      margin: 5px 0;
      font-size: 14px;
    }

    .org-id {
      font-family: monospace;
      background: #e9ecef;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Section -->
    <div id="loginSection">
      <h1>Super Admin Login</h1>
      <div id="loginMessage" class="message hidden"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit">Login</button>
      </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="hidden">
      <button class="logout-btn" onclick="logout()">Logout</button>
      
      <h1>Super Admin Dashboard</h1>
      <div id="dashboardMessage" class="message hidden"></div>
      
      <h2>Create New Organization</h2>
      <form id="createOrgForm">
        <div class="form-group">
          <label for="orgName">Organization Name</label>
          <input type="text" id="orgName" required>
        </div>
        <div class="form-group">
          <label for="orgDescription">Description (Optional)</label>
          <input type="text" id="orgDescription">
        </div>
        <button type="submit">Create Organization</button>
      </form>

      <h2 style="margin-top: 40px;">Organizations</h2>
      <ul id="orgList" class="org-list"></ul>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';
    let token = localStorage.getItem('superAdminToken');

    // Initialize
    if (token) {
      showDashboard();
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(`${API_URL}/auth/super-admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          token = data.token;
          localStorage.setItem('superAdminToken', token);
          showDashboard();
        } else {
          showMessage('loginMessage', data.error || 'Login failed', 'error');
        }
      } catch (error) {
        showMessage('loginMessage', 'Failed to connect to server', 'error');
      }
    });

    // Create Organization
    document.getElementById('createOrgForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('orgName').value;
      const description = document.getElementById('orgDescription').value;

      try {
        const response = await fetch(`${API_URL}/organizations`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ name, description })
        });

        const data = await response.json();

        if (response.ok) {
          showMessage('dashboardMessage', 'Organization created successfully!', 'success');
          document.getElementById('createOrgForm').reset();
          loadOrganizations();
        } else {
          showMessage('dashboardMessage', data.error || 'Failed to create organization', 'error');
        }
      } catch (error) {
        showMessage('dashboardMessage', 'Failed to connect to server', 'error');
      }
    });

    // Load Organizations
    async function loadOrganizations() {
      try {
        console.log('Loading organizations with token:', token);
        const response = await fetch(`${API_URL}/organizations`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        console.log('Response status:', response.status);
        const data = await response.json();
        console.log('Data received:', data);

        if (response.ok) {
          const orgList = document.getElementById('orgList');
          
          // Check if data is an array
          if (!Array.isArray(data)) {
            console.error('Expected array, got:', data);
            orgList.innerHTML = '<li class="org-item"><p style="color: red;">Error: Invalid response from server</p></li>';
            return;
          }
          
          if (data.length === 0) {
            orgList.innerHTML = '<li class="org-item"><p>No organizations yet</p></li>';
          } else {
            orgList.innerHTML = data.map(org => `
              <li class="org-item">
                <h3>${org.name}</h3>
                <p>${org.description || 'No description'}</p>
                <p><strong>ID:</strong> <span class="org-id">${org.id}</span></p>
                <p><strong>Created:</strong> ${new Date(org.createdAt).toLocaleString()}</p>
              </li>
            `).join('');
          }
        } else {
          console.error('Failed to load organizations:', data);
          const orgList = document.getElementById('orgList');
          orgList.innerHTML = `<li class="org-item"><p style="color: red;">Error: ${data.error || 'Failed to load'}</p></li>`;
        }
      } catch (error) {
        console.error('Failed to load organizations', error);
        const orgList = document.getElementById('orgList');
        orgList.innerHTML = '<li class="org-item"><p style="color: red;">Error loading organizations. Check console.</p></li>';
      }
    }

    function showDashboard() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      loadOrganizations();
    }

    function logout() {
      localStorage.removeItem('superAdminToken');
      token = null;
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('loginForm').reset();
    }

    function showMessage(elementId, message, type) {
      const element = document.getElementById(elementId);
      element.textContent = message;
      element.className = `message ${type}`;
      element.classList.remove('hidden');
      
      setTimeout(() => {
        element.classList.add('hidden');
      }, 5000);
    }
  </script>
</body>
</html>
